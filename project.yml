name: iPinball
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iPinball-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: iPinball
        # Portrait only: the table is a tall cabinet and a landscape layout
        # would mean a different, worse playfield.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ipinball
        PRODUCT_NAME: iPinball
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iPinball-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDisplayName: iPinball
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ipinball
        PRODUCT_NAME: iPinball
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true

  iPinballTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: iPinball-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ipinball.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iPinball.app/Contents/MacOS/iPinball
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iPinball-iOS:
    build:
      targets:
        iPinball-iOS: all
    run:
      config: Debug
  iPinball-macOS:
    build:
      targets:
        iPinball-macOS: all
        iPinballTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iPinballTests
