name: iVidiPinball
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iVidiPinball-iOS:
    productName: iVidiPinball
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: iVidiPinball
        # Portrait only: the table is a tall cabinet and a landscape layout
        # would mean a different, worse playfield.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No cryptography beyond what the system does: no export paperwork.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividipinball
        DEVELOPMENT_TEAM: S769436W24
        PRODUCT_NAME: iVidiPinball
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iVidiPinball-macOS:
    productName: iVidiPinball
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDisplayName: iVidiPinball
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
        NSHighResolutionCapable: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividipinball
        DEVELOPMENT_TEAM: S769436W24
        PRODUCT_NAME: iVidiPinball
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          # XCTest injects an ad-hoc signed bundle into the host app.
          ENABLE_HARDENED_RUNTIME: false

  iVidiPinballTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: iVidiPinball-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividipinball.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iVidiPinball.app/Contents/MacOS/iVidiPinball
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iVidiPinball-iOS:
    build:
      targets:
        iVidiPinball-iOS: all
    run:
      config: Debug
  iVidiPinball-macOS:
    build:
      targets:
        iVidiPinball-macOS: all
        iVidiPinballTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iVidiPinballTests
